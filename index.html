<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan — Mempelai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f5f0;
      --surface: #ffffff;
      --ink: #231f1c;
      --muted: #6e655f;
      --accent: #8c6d46;
      --accent-soft: rgba(140, 109, 70, 0.14);
      --border: rgba(35, 31, 28, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header / Pembuka Formal */
    header.hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 20px;
      background:
        radial-gradient(circle at top, rgba(140, 109, 70, 0.10), transparent 60%),
        var(--bg);
    }

    .hero-inner {
      max-width: 620px;
    }

    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
      font-weight: 600;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.12;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .hero .ampersand {
      display: block;
      font-style: italic;
      color: var(--accent);
      font-size: 0.72em;
      margin: 4px 0;
    }

    .hero-date {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 22px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--muted);
    }

    .scroll-hint {
      margin-top: 44px;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* Bagian Acara */
    .section-block {
      padding: 56px 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .section-header h2 {
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      margin-bottom: 8px;
    }

    .section-header p {
      color: var(--muted);
      font-size: 0.96rem;
      max-width: 540px;
      margin: 0 auto;
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(35, 31, 28, 0.04);
    }

    .event-card h3 {
      font-size: 1.65rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .event-card p {
      font-size: 0.93rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .map-link {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .map-link:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    /* Galeri Foto dengan Teks Meluncur ke Atas & Variasi Tiap Foto */
    .story-stack {
      display: flex;
      flex-direction: column;
      gap: 44px;
    }

    .photo-story-card {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: #1c1815;
      min-height: 460px;
      box-shadow: 0 18px 45px rgba(35, 31, 28, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      --lift: 42px;
      --fade: 0.35;
      --img-scale: 1.06;
      --img-x: 0%;
      --img-rot: 0deg;
    }

    /* Variasi khusus per indeks foto */
    .photo-story-card[data-variant="zoom-in"] {
      --img-scale: calc(1.03 + var(--p, 0) * 0.10);
      --img-x: 0%;
      --img-rot: 0deg;
    }

    .photo-story-card[data-variant="pan-right"] {
      --img-scale: 1.12;
      --img-x: calc(-4% + var(--p, 0) * 6%);
      --img-rot: 0deg;
    }

    .photo-story-card[data-variant="tilt-soft"] {
      --img-scale: 1.09;
      --img-x: 0%;
      --img-rot: calc(-1.2deg + var(--p, 0) * 2.4deg);
    }

    .photo-story-card[data-variant="zoom-out"] {
      --img-scale: calc(1.15 - var(--p, 0) * 0.10);
      --img-x: 0%;
      --img-rot: 0deg;
    }

    .photo-story-card img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      display: block;
      transform: translateX(var(--img-x)) scale(var(--img-scale)) rotate(var(--img-rot));
      transition: transform 0.18s ease-out;
      will-change: transform;
    }

    /* Gradasi bawah agar teks di atas foto tetap kontras dan elegan */
    .photo-story-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(18, 15, 12, 0.88) 0%,
        rgba(18, 15, 12, 0.45) 48%,
        rgba(18, 15, 12, 0.08) 100%
      );
      pointer-events: none;
    }

    /* Teks yang digulir/meluncur ke atas foto */
    .overlay-text {
      position: relative;
      z-index: 2;
      margin-top: -190px;
      padding: 28px 28px 30px;
      color: #fff;
      transform: translateY(var(--lift));
      opacity: var(--fade);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease-out;
      will-change: transform, opacity;
    }

    /* Variasi posisi alignment teks antar foto */
    .photo-story-card[data-align="left"] .overlay-text {
      text-align: left;
      max-width: 92%;
    }

    .photo-story-card[data-align="center"] .overlay-text {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
      max-width: 88%;
    }

    .photo-story-card[data-align="editorial"] .overlay-text {
      text-align: left;
      border-left: 3px solid #e2c799;
      padding-left: 20px;
      margin-left: 24px;
      margin-right: 24px;
      background: rgba(20, 17, 14, 0.38);
      backdrop-filter: blur(4px);
      border-radius: 0 16px 16px 0;
      padding-top: 18px;
      padding-bottom: 18px;
    }

    .tag-pill {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #f4e4c8;
      margin-bottom: 10px;
    }

    .overlay-text h3 {
      font-size: clamp(1.55rem, 3.6vw, 2.2rem);
      line-height: 1.2;
      color: #fff;
      margin-bottom: 8px;
    }

    .overlay-text p.quote-line {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 2.5vw, 1.38rem);
      line-height: 1.45;
      color: #f7efe2;
      margin-bottom: 6px;
    }

    .overlay-text p.note-line {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.82);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 56px 20px 72px;
      color: var(--muted);
      font-size: 0.9rem;
